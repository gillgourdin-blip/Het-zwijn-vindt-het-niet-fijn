const LV=[[8,1.3,.05,3,1],[9,1.4,.05,2.8,1],[10,1.5,.06,2.5,1],[11,1.6,.06,2.3,1],[12,1.7,.06,2,1],[12,1.7,.07,2,2],[13,1.8,.07,1.8,2],[14,1.9,.07,1.6,2],[15,2,.07,1.5,2],[16,2.1,.07,1.5,2]];
const C=15,R=17,cv=document.getElementById('c'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
let M=ROOMS[0].m,T,dpr,state='menu',p,bs=[],coins=[],got=0,total=8,lives=3,hold=0,inv=0,t=0,level=1,banner=0,food=null,foodT=0,pads=[],dash=0,dd={x:0,y:0},boostT=0,lock=null;
try{level=Math.min(10,Math.max(1,+localStorage.getItem('kj')||1));}catch(e){}

const wall=(x,y)=>y<0||y>=R||x<0||x>=C||M[y][x]==='#';

const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const boar=(x,y,c,k)=>({x,y,c,k,f:1});
function resetPos(){const L=LV[level-1],B=ROOMS[level-1].b;p={x:7.5,y:15.5};bs=[boar(B[0]+.5,B[1]+.5,true,1)];if(L[4]>1)bs.push(boar(1.5,1.5,false,.85));hold=L[3];inv=1.5;dash=0;boostT=0;lock=null;}
function makePads(B){
  pads=[];const c=[],D=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    if(wall(x,y)||Math.abs(x-7)+Math.abs(y-15)<4||Math.abs(x-B[0])+Math.abs(y-B[1])<4)continue;
    const ok=D.filter(([a,b])=>[1,2,3].every(k=>!wall(x+a*k,y+b*k)));
    if(ok.length)c.push({x,y,ok});
  }
  c.sort(()=>Math.random()-.5);
  for(const q of c){if(pads.length>=3)break;
    if(pads.every(a=>Math.abs(a.x-q.x)+Math.abs(a.y-q.y)>4)){const d=q.ok[Math.random()*q.ok.length|0];pads.push({x:q.x,y:q.y,dx:d[0],dy:d[1]});}}
}
function startLevel(){

  const f=[];

const SR=85,st=$('stick'),kn=$('knob');let sid=null,axis=null,lastD=null;
function stickMove(e){const r=st.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy);
  if(l>SR){dx*=SR/l;dy*=SR/l;l=SR;}
  kn.style.transform='translate('+dx+'px,'+dy+'px)';
  if(l<10){dir.x=dir.y=0;axis=null;return;}
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(!axis)axis=ax>ay?'x':'y';
  else if(axis==='x'&&ay>ax*1.4)axis='y';
  else if(axis==='y'&&ax>ay*1.4)axis='x';
  dir.x=axis==='x'?Math.sign(dx):0;dir.y=axis==='y'?Math.sign(dy):0;}
st.addEventListener('pointerdown',e=>{sid=e.pointerId;st.setPointerCapture(sid);stickMove(e);});
st.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e);});
const up=()=>{sid=null;axis=null;lastD=null;dir.x=dir.y=0;kn.style.transform='translate(0,0)';};

function hit(x,y,r){return wall(Math.floor(x-r),Math.floor(y-r))||wall(Math.floor(x+r),Math.floor(y-r))||wall(Math.floor(x-r),Math.floor(y+r))||wall(Math.floor(x+r),Math.floor(y+r));}
function step(z){
  const s=[[1,0],[-1,0],[0,1],[0,-1]],sy=z.y|0,sx=z.x|0,tx=p.x|0,ty=p.y|0;
  if(sx===tx&&sy===ty)return{x:p.x,y:p.y};
  const prev=new Map(),q=[[sx,sy]];prev.set(sy*C+sx,-1);
  for(let i=0;i<q.length;i++){const[x,y]=q[i];if(x===tx&&y===ty)break;
    for(const[dx,dy]of s){const nx=x+dx,ny=y+dy,k=ny*C+nx;if(!wall(nx,ny)&&!prev.has(k)){prev.set(k,y*C+x);q.push([nx,ny]);}}}
  let k=ty*C+tx;if(!prev.has(k))return{x:p.x,y:p.y};
  while(prev.get(k)!==sy*C+sx)k=prev.get(k);
  return{x:(k%C)+.5,y:((k/C)|0)+.5};
}
function update(dt){
  let dx=dir.x,dy=dir.y;
  if(keys.ArrowLeft)dx=-1;if(keys.ArrowRight)dx=1;if(keys.ArrowUp)dy=-1;if(keys.ArrowDown)dy=1;
  if(dx||dy){
    const ok=(a,b)=>!hit(p.x+a*.15,p.y+b*.15,.28);
    if(ok(dx,dy))lastD={x:dx,y:dy};
    else if(lastD&&ok(lastD.x,lastD.y)){dx=lastD.x;dy=lastD.y;}
  }else lastD=null;
  let spd=3.9;if(dash>0){dash-=dt;dx=dd.x;dy=dd.y;spd=9;}else if(boostT>0){boostT-=dt;spd=5;}
  const sp=spd*dt,r=.28;
  let nx=p.x+dx*sp;if(!hit(nx,p.y,r))p.x=nx;
  let ny=p.y+dy*sp;if(!hit(p.x,ny,r))p.y=ny;
  const k=Math.min(1,dt*9);
  if(Math.abs(dx)>Math.abs(dy)){const c=Math.floor(p.y)+.5,v=p.y+(c-p.y)*k;if(!hit(p.x,v,r))p.y=v;}
  else if(Math.abs(dy)>0){const c=Math.floor(p.x)+.5,v=p.x+(c-p.x)*k;if(!hit(v,p.y,r))p.x=v;}
  const pd=pads.find(a=>(p.x|0)===a.x&&(p.y|0)===a.y);
  if(pd){if(lock!==pd){lock=pd;dash=.4;boostT=1.2;dd={x:pd.dx,y:pd.dy};beep(700,.06);setTimeout(()=>beep(1100,.1),60);buzz(25);}}else lock=null;
  inv=Math.max(0,inv-dt);banner-=dt;
  const L=LV[level-1];
  if(hold>0)hold-=dt;else for(const z of bs){
    const tg=step(z),bsp=Math.min(3.2,L[1]+L[2]*got)*z.k*dt,ddx=tg.x-z.x,ddy=tg.y-z.y,d=Math.hypot(ddx,ddy);
    if(d>.001){const m=Math.min(bsp,d);z.x+=ddx/d*m;z.y+=ddy/d*m;z.f=ddx<0?-1:1;}
  }
  if(food){
    food.ttl-=dt;
    if(food.ttl<=0)food=null;
    else if(Math.hypot(food.x-p.x,food.y-p.y)<.5){lives=Math.min(5,lives+1);food=null;beep(660,.08);setTimeout(()=>beep(990,.12),90);buzz(30);hud();}
  }else{
    foodT-=dt;
    if(foodT<=0){foodT=10+Math.random()*10;if(lives<5&&Math.random()<.7)spawnFood();}
  }
  for(let i=coins.length-1;i>=0;i--)if(Math.hypot(coins[i].x-p.x,coins[i].y-p.y)<.5){coins.splice(i,1);got++;beep(880+got*30);buzz(15);hud();if(got>=total){end(true);return;}}
  if(inv<=0&&bs.some(z=>Math.hypot(z.x-p.x,z.y-p.y)<.6)){lives--;buzz(200);beep(120,.3);hud();if(lives<=0){end(false);return;}resetPos();}
}
function draw(){
  const th=ROOMS[level-1].c;
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,VW*T,VH*T);g.textAlign='center';g.textBaseline='middle';
  const tx=Math.max(0,Math.min(C-VW,p.x-VW/2)),ty=Math.max(0,Math.min(R-VH,p.y-VH/2));
  if(camX===null){camX=tx;camY=ty;}else{camX+=(tx-camX)*.2;camY+=(ty-camY)*.2;}
  g.translate(-camX*T,-camY*T);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    if(wall(x,y)){g.fillStyle=th[2];g.fillRect(x*T,y*T,T,T);g.fillStyle=th[3];g.fillRect(x*T+2,y*T+2,T-4,T/2-3);g.fillRect(x*T+2,y*T+T/2+1,T-4,T/2-3);
      if((x*7+y*13)%6===0&&x>0&&y>0&&x<C-1&&y<R-1){g.font=T*.5+'px serif';g.fillText(th[4],(x+.5)*T,(y+.5)*T);}}
    else{g.fillStyle=(x+y)%2?th[0]:th[1];g.fillRect(x*T,y*T,T,T);}
  }
  for(const a of pads){
    g.save();g.translate((a.x+.5)*T,(a.y+.5)*T);g.rotate(Math.atan2(a.dy,a.dx));
    const k=T*(1+Math.sin(t*6)*.06);g.shadowColor='#ffd23f';g.shadowBlur=T*.4;
    g.beginPath();g.moveTo(-.42*k,-.15*k);g.lineTo(0,-.15*k);g.lineTo(0,-.36*k);g.lineTo(.46*k,0);g.lineTo(0,.36*k);g.lineTo(0,.15*k);g.lineTo(-.42*k,.15*k);g.closePath();
    g.fillStyle='#ffd23f';g.fill();g.shadowBlur=0;g.lineWidth=2;g.strokeStyle='#ff7a00';g.stroke();g.restore();
  }
  g.font=T*.6+'px serif';
  for(const c of coins)g.fillText('🪙',c.x*T,(c.y+Math.sin(t*4+c.x*3)*.06)*T);
  if(food&&(food.ttl>3||Math.floor(t*8)%2)){
    g.font=T*.7+'px serif';g.fillText(food.e,food.x*T,(food.y+Math.sin(t*5)*.07)*T);
    g.font=T*.32+'px serif';g.fillText('❤️',(food.x+.32)*T,(food.y-.32)*T);
  }
  g.font=T*.85+'px serif';
  if(!(inv>0&&Math.floor(t*10)%2))g.fillText('🧒',p.x*T,p.y*T);
  if(dash>0||boostT>0){g.font=T*.4+'px serif';g.fillText('⚡',(p.x-.4)*T,(p.y-.1)*T);}
  for(const z of bs){
    g.font=T*.85+'px serif';g.save();g.translate(z.x*T+(hold>0?Math.sin(t*40)*1.5:0),z.y*T);g.scale(z.f,1);g.fillText('🐗',0,0);g.restore();
    if(z.c){g.font=T*.5+'px serif';g.fillText('👑',z.x*T,(z.y-.5)*T);}
    if(hold>0){g.font=T*.45+'px serif';g.fillText('💤',(z.x+.5)*T,(z.y-.7)*T);}
  }
  g.setTransform(dpr,0,0,dpr,0,0);
  for(const z of bs){const sx=(z.x-camX)*T,sy=(z.y-camY)*T,m=T*.45;
    if(sx<0||sy<0||sx>VW*T||sy>VH*T){const ix=Math.max(m,Math.min(VW*T-m,sx)),iy=Math.max(m,Math.min(VH*T-m,sy));
      g.fillStyle='rgba(255,60,60,.55)';g.beginPath();g.arc(ix,iy,T*.38,0,7);g.fill();g.font=T*.5+'px serif';g.fillText('🐗',ix,iy);}}
  if(banner>0&&state==='play'){g.globalAlpha=Math.min(1,banner);g.font='bold '+T*.7+'px system-ui';g.fillStyle='#fff';g.shadowColor='#000';g.shadowBlur=6;g.fillText('Level '+level+' · '+ROOMS[level-1].n,VW*T/2,T*.9);g.shadowBlur=0;g.globalAlpha=1;}
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;if(state==='play')update(dt);if(p)draw();requestAnimationFrame(loop);}
hud();requestAnimationFrame(loop);
</script></body></html>
